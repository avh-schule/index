<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVH Admin Command Center</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        surface: {
                            base: '#090d16',
                            card: '#121826',
                            border: '#1f293d',
                            hover: '#1a2333'
                        },
                        accent: {
                            indigo: '#6366f1',
                            amber: '#f59e0b',
                            emerald: '#10b981',
                            rose: '#f43f5e'
                        }
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090d16; color: #f3f4f6; }
        .glass-panel { background: rgba(18, 24, 38, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.07); }
        .glow-indigo { box-shadow: 0 0 20px -5px rgba(99, 102, 241, 0.25); }
        .glow-amber { box-shadow: 0 0 20px -5px rgba(245, 158, 11, 0.25); }
    </style>
</head>
<body class="min-h-screen pb-20 selection:bg-indigo-500 selection:text-white">

    <!-- TOP NAVIGATION -->
    <header class="sticky top-0 z-40 glass-panel border-b border-surface-border px-4 py-3.5">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-1 rounded-full">
                    <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
                    <span class="text-[11px] font-bold text-indigo-400 tracking-wider uppercase">Schülersprecher Admin</span>
                </div>
                <h1 class="font-bold text-sm text-white tracking-tight hidden sm:block">AVH Ideenbox Control Panel</h1>
            </div>
            <button onclick="loadData()" class="flex items-center gap-2 px-3 py-1.5 bg-surface-hover hover:bg-white/10 text-gray-300 text-xs font-semibold rounded-xl border border-white/10 transition-all active:scale-95">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                <span>Aktualisieren</span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-8 space-y-6">

        <!-- STATS BAR -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="glass-panel p-3.5 rounded-2xl flex flex-col justify-between">
                <span class="text-[11px] font-medium text-gray-400">Gesamt</span>
                <span id="statTotal" class="text-xl font-extrabold text-white mt-1">0</span>
            </div>
            <div class="glass-panel p-3.5 rounded-2xl flex flex-col justify-between">
                <span class="text-[11px] font-medium text-amber-400">In Prüfung</span>
                <span id="statReview" class="text-xl font-extrabold text-amber-400 mt-1">0</span>
            </div>
            <div class="glass-panel p-3.5 rounded-2xl flex flex-col justify-between">
                <span class="text-[11px] font-medium text-indigo-400">In Umsetzung</span>
                <span id="statProgress" class="text-xl font-extrabold text-indigo-400 mt-1">0</span>
            </div>
            <div class="glass-panel p-3.5 rounded-2xl flex flex-col justify-between">
                <span class="text-[11px] font-medium text-emerald-400">Umgesetzt</span>
                <span id="statDone" class="text-xl font-extrabold text-emerald-400 mt-1">0</span>
            </div>
        </div>

        <!-- IDEAS CONTAINER -->
        <div id="ideasContainer" class="space-y-4">
            <div class="glass-panel p-8 rounded-2xl text-center text-xs text-gray-400">
                <i data-lucide="loader-2" class="w-5 h-5 animate-spin mx-auto mb-2 text-indigo-400"></i>
                Lade Daten aus Supabase...
            </div>
        </div>
    </main>

    <!-- EDIT MODAL -->
    <div id="editModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="glass-panel w-full max-w-lg rounded-2xl p-6 glow-indigo relative">
            <h3 class="text-sm font-bold text-white mb-4 flex items-center gap-2">
                <i data-lucide="edit-3" class="w-4 h-4 text-indigo-400"></i> Idee überarbeiten
            </h3>
            <form onsubmit="saveEdit(event)" class="space-y-4">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-1.5">Titel</label>
                    <input type="text" id="editTitle" required class="w-full bg-surface-base border border-surface-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-1.5">Beschreibung</label>
                    <textarea id="editDesc" rows="4" required class="w-full bg-surface-base border border-surface-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-indigo-500 leading-relaxed"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('editModal')" class="px-4 py-2 text-xs font-semibold text-gray-400 hover:text-white">Abbrechen</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition-all">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <!-- OFFICIAL COMMENT MODAL -->
    <div id="commentModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="glass-panel w-full max-w-lg rounded-2xl p-6 glow-amber relative">
            <h3 class="text-sm font-bold text-amber-400 mb-1 flex items-center gap-2">
                <i data-lucide="badge-check" class="w-4 h-4"></i> Antwort vom Schülersprecher
            </h3>
            <p class="text-[11px] text-gray-400 mb-4">Dieser Kommentar wird in der Haupt-App ganz oben hervorgehoben.</p>
            <form onsubmit="saveOfficialComment(event)" class="space-y-4">
                <input type="hidden" id="commentIdeaId">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-1.5">Absender Name</label>
                    <input type="text" id="commentAuthor" value="Schülersprecher" required class="w-full bg-surface-base border border-surface-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-1.5">Stellungnahme / Antwort</label>
                    <textarea id="commentText" rows="4" placeholder="Antwort eingeben..." required class="w-full bg-surface-base border border-surface-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-500 leading-relaxed"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('commentModal')" class="px-4 py-2 text-xs font-semibold text-gray-400 hover:text-white">Abbrechen</button>
                    <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-black px-4 py-2 rounded-xl text-xs font-bold transition-all">Veröffentlichen</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://tnpkgqoebbpyutoinsbi.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRucGtncW9lYmJweXV0b2luc2JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NDQ3ODQsImV4cCI6MjEwNDAyMDc4NH0.4ez0lvMr0CDAVHf1QMfT-MuQOt6dniseMgBhuLYff-A";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let listData = [];

        const STATUS_MAP = {
            'waiting_for_review': { label: 'In Prüfung ⏳', style: 'border-amber-500/30 text-amber-400 bg-amber-500/10' },
            'reviewing': { label: 'Wird besprochen 💬', style: 'border-blue-500/30 text-blue-400 bg-blue-500/10' },
            'in_progress': { label: 'In Umsetzung 🚧', style: 'border-indigo-500/30 text-indigo-400 bg-indigo-500/10' },
            'done': { label: 'Umgesetzt 🎉', style: 'border-emerald-500/30 text-emerald-400 bg-emerald-500/10' },
            'rejected': { label: 'Nicht möglich ❌', style: 'border-rose-500/30 text-rose-400 bg-rose-500/10' }
        };

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadData();
        });

        async function loadData() {
            const { data, error } = await db.from('ideas').select('*').order('created_at', { ascending: false });
            if (error) {
                alert("Fehler beim Laden: " + error.message);
                return;
            }
            listData = data || [];
            updateStats();
            render();
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = listData.length;
            document.getElementById('statReview').textContent = listData.filter(i => i.status === 'waiting_for_review' || i.status === 'reviewing').length;
            document.getElementById('statProgress').textContent = listData.filter(i => i.status === 'in_progress').length;
            document.getElementById('statDone').textContent = listData.filter(i => i.status === 'done').length;
        }

        function render() {
            const c = document.getElementById('ideasContainer');
            if (!listData.length) {
                c.innerHTML = '<div class="glass-panel p-8 rounded-2xl text-center text-xs text-gray-400">Keine Ideen vorhanden.</div>';
                return;
            }

            c.innerHTML = listData.map(item => {
                const curStatus = STATUS_MAP[item.status] || STATUS_MAP['waiting_for_review'];
                return `
                <div class="glass-panel rounded-2xl p-5 space-y-4">
                    
                    <!-- HEADER BAR -->
                    <div class="flex items-center justify-between gap-3 flex-wrap pb-3 border-b border-surface-border">
                        
                        <!-- STATUS SELECTOR -->
                        <div class="relative">
                            <select onchange="changeStatus('${item.id}', this.value)" class="appearance-none text-xs font-bold rounded-xl px-3 py-1.5 pr-7 border cursor-pointer focus:outline-none transition-all ${curStatus.style}">
                                ${Object.keys(STATUS_MAP).map(key => `
                                    <option value="${key}" ${item.status === key ? 'selected' : ''} class="bg-surface-card text-white">
                                        ${STATUS_MAP[key].label}
                                    </option>
                                `).join('')}
                            </select>
                            <i data-lucide="chevron-down" class="w-3.5 h-3.5 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none opacity-60"></i>
                        </div>

                        <!-- ACTIONS -->
                        <div class="flex items-center gap-1.5 ml-auto">
                            <button onclick="openCommentModal('${item.id}')" class="px-3 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 text-xs font-bold rounded-xl border border-amber-500/30 flex items-center gap-1.5 transition-all">
                                <i data-lucide="message-square-plus" class="w-3.5 h-3.5"></i>
                                <span>Antworten</span>
                            </button>
                            <button onclick="openEditModal('${item.id}')" class="p-1.5 bg-surface-hover hover:bg-white/10 text-gray-300 rounded-xl border border-white/5 transition-all">
                                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                            </button>
                            <button onclick="deleteIdea('${item.id}')" class="p-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-xl border border-rose-500/20 transition-all">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- CONTENT -->
                    <div class="space-y-1.5">
                        <h4 class="font-bold text-sm text-white leading-snug">${esc(item.title)}</h4>
                        <p class="text-xs text-gray-300 leading-relaxed whitespace-pre-line">${esc(item.description)}</p>
                    </div>

                    <!-- META FOOTER -->
                    <div class="flex items-center justify-between text-[11px] text-gray-400 pt-1">
                        <span class="flex items-center gap-1"><i data-lucide="user" class="w-3 h-3 text-gray-500"></i> ${esc(item.author_name || 'Anonym')}</span>
                        <span class="flex items-center gap-1 font-semibold text-indigo-400"><i data-lucide="thumbs-up" class="w-3 h-3"></i> ${item.upvotes_count || 0} Stimmen</span>
                    </div>

                    <!-- COMMENTS TOGGLE -->
                    <div class="pt-2 border-t border-surface-border">
                        <button onclick="toggleComments('${item.id}')" class="text-[11px] font-bold text-indigo-400 hover:text-indigo-300 flex items-center gap-1.5 transition-all">
                            <i data-lucide="messages-square" class="w-3.5 h-3.5"></i> Kommentare verwalten
                        </button>
                        <div id="comments-box-${item.id}" class="hidden mt-3 space-y-2"></div>
                    </div>

                </div>
            `}).join('');

            lucide.createIcons();
        }

        async function changeStatus(id, newStatus) {
            const { error } = await db.from('ideas').update({ status: newStatus }).eq('id', id);
            if (error) {
                alert("Fehler beim Aktualisieren: " + error.message);
                return;
            }
            const found = listData.find(i => i.id === id);
            if (found) found.status = newStatus;
            updateStats();
            render();
        }

        async function deleteIdea(id) {
            if (!confirm('Idee unwiderruflich löschen?')) return;
            await db.from('comments').delete().eq('idea_id', id);
            await db.from('ideas').delete().eq('id', id);
            listData = listData.filter(i => i.id !== id);
            updateStats();
            render();
        }

        function openEditModal(id) {
            const item = listData.find(i => i.id === id);
            if (!item) return;
            document.getElementById('editId').value = item.id;
            document.getElementById('editTitle').value = item.title;
            document.getElementById('editDesc').value = item.description;
            document.getElementById('editModal').classList.remove('hidden');
        }

        async function saveEdit(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const title = document.getElementById('editTitle').value;
            const description = document.getElementById('editDesc').value;

            await db.from('ideas').update({ title, description }).eq('id', id);
            closeModal('editModal');
            loadData();
        }

        function openCommentModal(id) {
            document.getElementById('commentIdeaId').value = id;
            document.getElementById('commentModal').classList.remove('hidden');
        }

        async function saveOfficialComment(e) {
            e.preventDefault();
            const idea_id = document.getElementById('commentIdeaId').value;
            const author_name = document.getElementById('commentAuthor').value;
            const content = document.getElementById('commentText').value;

            await db.from('comments').insert([{
                idea_id, author_name, content, is_published: true, is_official: true
            }]);

            document.getElementById('commentText').value = '';
            closeModal('commentModal');
            toggleComments(idea_id, true);
        }

        async function toggleComments(ideaId, forceReload = false) {
            const box = document.getElementById(`comments-box-${ideaId}`);
            if (box.classList.contains('hidden') || forceReload) {
                box.classList.remove('hidden');
                box.innerHTML = '<span class="text-[10px] text-gray-500">Lade Kommentare...</span>';
                
                const { data } = await db.from('comments').select('*').eq('idea_id', ideaId).order('created_at', { ascending: true });
                if (!data || !data.length) {
                    box.innerHTML = '<span class="text-[10px] text-gray-500 italic block py-1">Keine Kommentare vorhanden</span>';
                    return;
                }

                box.innerHTML = data.map(c => `
                    <div class="p-3 rounded-xl text-xs flex items-center justify-between border transition-all ${c.is_official ? 'bg-amber-500/10 border-amber-500/30' : 'bg-surface-base border-surface-border'}">
                        <div class="space-y-0.5">
                            <span class="font-bold text-[10px] flex items-center gap-1 ${c.is_official ? 'text-amber-400' : 'text-gray-400'}">
                                ${c.is_official ? '<i data-lucide="pin" class="w-3 h-3"></i> ' + esc(c.author_name || 'Schülersprecher') : esc(c.author_name)}
                            </span>
                            <p class="text-gray-200">${esc(c.content)}</p>
                        </div>
                        <button onclick="deleteComment('${c.id}', '${ideaId}')" class="text-rose-400 hover:text-rose-300 p-1">
                            <i data-lucide="trash" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `).join('');
                lucide.createIcons();
            } else {
                box.classList.add('hidden');
            }
        }

        async function deleteComment(commentId, ideaId) {
            if (!confirm('Kommentar löschen?')) return;
            await db.from('comments').delete().eq('id', commentId);
            toggleComments(ideaId, true);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function esc(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
