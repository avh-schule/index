name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into index.html
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          MISTRAL_KEY_1: ${{ secrets.MISTRAL_KEY_1 }}
          MISTRAL_KEY_2: ${{ secrets.MISTRAL_KEY_2 }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          file = Path("index.html")
          content = file.read_text(encoding="utf-8")

          replacements = {
              "__SUPABASE_URL__": os.environ["SUPABASE_URL"],
              "__SUPABASE_ANON_KEY__": os.environ["SUPABASE_ANON_KEY"],
              "__GROQ_KEY__": os.environ["GROQ_KEY"],
              "__MISTRAL_KEY_1__": os.environ["MISTRAL_KEY_1"],
              "__MISTRAL_KEY_2__": os.environ["MISTRAL_KEY_2"],
              "__GEMINI_KEY__": os.environ.get("GEMINI_KEY", ""),
          }

          for placeholder, value in replacements.items():
              content = content.replace(placeholder, value)

          file.write_text(content, encoding="utf-8")
          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
